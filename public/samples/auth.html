<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>样稿 · 登录状态 · 小离总周报</title>
<link rel="stylesheet" href="sample.css">
<style>
  .switch { display: flex; justify-content: center; gap: 8px; padding: 12px; }
  .gate { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px); padding: 20px 16px 60px; }
  .panel { width: min(420px, 100%); padding: 28px 26px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); text-align: center; box-shadow: 0 10px 30px rgb(30 28 25 / .06); }
  .panel .logo { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 13px; background: var(--accent); color: #fff; font: 700 22px var(--serif); }
  .panel h1 { margin: 14px 0 6px; font-size: 21px; }
  .panel p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
  .panel .go { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 46px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; font-size: 15px; font-weight: 600; }
  .panel .go:hover { border-color: var(--accent); }
  .panel .g { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#4285f4 0 25%, #34a853 0 50%, #fbbc05 0 75%, #ea4335 0); }
  .panel .acct { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; padding: 10px 12px; border-radius: 10px; background: var(--bg); text-align: left; font-size: 14px; }
  .panel .acct small { display: block; color: var(--ink-3); font-size: 12px; }
  .panel .row { display: flex; gap: 8px; }
  .panel .row button { flex: 1; height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; }
  .panel .row .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .panel .note { margin: 16px 0 0; color: var(--ink-3); font-size: 12px; }
</style>
</head>
<body>
<div class="ribbon">样稿：登录状态示意，按钮不会真的登录 · <a href="./">返回样稿目录</a></div>
<div class="switch seg" style="display:flex;width:max-content;margin:12px auto 0" role="group" aria-label="切换状态">
  <button data-s="out" aria-pressed="true">未登录</button><button data-s="deny" aria-pressed="false">无权限</button>
</div>
<main class="gate">
  <section class="panel" data-v="out">
    <span class="logo">离</span>
    <h1>小离总周报</h1>
    <p>这里放的是家里人在写的书稿和整理笔记，<br>登录后才能看。</p>
    <button class="go" onclick="toast('样稿：这里会打开 Google 登录')"><span class="g"></span>用 Google 账号登录</button>
    <p class="note">只用来确认你是谁，不会读取邮箱或别的内容。</p>
  </section>
  <section class="panel" data-v="deny" hidden>
    <span class="logo" style="background:var(--ink-3)">离</span>
    <h1>这个账号还没有开通</h1>
    <p>书稿只对家里人开放。把下面的邮箱发给小离，开通后刷新本页就能看。</p>
    <div class="acct"><span class="avatar" style="background:var(--ink-3)">访</span><span>visitor@example.com<small>已登录 · 未在名单里</small></span></div>
    <div class="row"><button onclick="toast('已复制邮箱')">复制邮箱</button><button class="primary" onclick="toast('样稿：这里会退出并换个账号')">换个账号</button></div>
  </section>
</main>
<script src="sample.js"></script>
<script>
  document.querySelector('[role=group]').addEventListener('click', (e) => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    document.querySelectorAll('[data-s]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.querySelectorAll('.panel').forEach((p) => { p.hidden = p.dataset.v !== b.dataset.s; });
  });
</script>
</body>
</html>
