<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>样稿 · 阅读 · 小离总周报</title>
<link rel="stylesheet" href="sample.css">
<style>
  .doc [id] { scroll-margin-top: calc(var(--bar-h) + 18px); }
  .swatch { display: inline-block; width: 16px; height: 3px; margin-right: 6px; vertical-align: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div class="ribbon">样稿：书名之外的人物、地点、事件、正文均为虚构占位 · <a href="./">返回样稿目录</a></div>
<header class="bar">
  <button class="iconbtn only-phone" data-drawer aria-label="目录"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <a class="back" href="home.html" aria-label="返回书架"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span>书架</span></a>
  <div class="book"><b>Maritime Story</b><small>第1–17章 · 11月18日同步</small></div>
  <span class="sp"></span>
  <nav class="tabs" aria-label="视图">
    <a href="reader.html" aria-current="page">阅读</a>
    <a href="timeline.html">时间线</a>
    <button type="button" class="soon" data-soon>校稿台 <span class="soon-tag">即将</span></button>
  </nav>
  <span class="sp"></span>
  <button class="searchbtn" data-search><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>搜索人物、事件、原文<kbd>/</kbd></button>
  <button class="iconbtn only-phone" data-search aria-label="搜索"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
  <button class="avatar" aria-label="账号：小离" onclick="toast('已登录：小离 · 家庭成员')">离</button>
</header>

<div class="reader">
  <aside class="side" aria-label="目录"></aside>
  <main class="doc" id="main"><div class="doc-inner" id="doc"></div></main>
  <aside class="rail" id="rail" aria-label="本页"></aside>
</div>
<div class="scrim"></div>

<nav class="tabbar" aria-label="视图">
  <a href="reader.html" aria-current="page"><svg class="i" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13"/></svg>阅读</a>
  <a href="timeline.html"><svg class="i" viewBox="0 0 24 24"><path d="M6 3v18"/><circle cx="6" cy="7" r="2"/><circle cx="6" cy="15" r="2"/><path d="M10 7h10M10 15h7"/></svg>时间线</a>
  <button type="button" data-soon><svg class="i" viewBox="0 0 24 24"><path d="M5 19h14M7 15l9-9 3 3-9 9H7z"/></svg>校稿台</button>
  <button type="button" data-search><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>搜索</button>
</nav>

<script src="sample-data.js"></script>
<script src="sample.js"></script>
<script>
(() => {
  const S = SAMPLE, O = S.ownerById;
  const doc = document.getElementById('doc'), rail = document.getElementById('rail'), side = document.querySelector('.side');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dom = Object.fromEntries(S.domains);
  const COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
  const color = {}; S.owners.filter((o) => !S.axis.includes(o.id)).forEach((o, i) => { color[o.id] = COLORS[i % 8]; });
  const ent = (id) => `<a class="ent" href="#o-${id}" data-o="${id}">${esc(O[id].name)}</a>`;
  const ev = (pid) => `<a class="ev" href="#e-${pid}">${S.pid(pid.split('@')[0])}</a>`;
  const loc = (l) => { const x = S.loc(l); return `<a class="loc" href="${x.href.replace('reader.html', '')}">${x.label}</a>`; };
  const pointsOf = (id) => O[id].pts.map(([pid, text, key]) => ({ pid, text, key, p: S.points[pid] })).sort((a, b) => a.p.r - b.p.r);
  const ordered = Object.entries(S.points).sort((a, b) => a[1].r - b[1].r);

  /* ---------- 目录 ---------- */
  const bySec = (d) => S.owners.filter((o) => o.domain === d);
  side.innerHTML = `<h3>总览</h3>
    <a class="navlink" href="#index">总目录</a>
    <a class="navlink" href="#events">事件索引 <span class="n">${new Set(Object.keys(S.points).map((p) => p.split('@')[0])).size}</span></a>
    <a class="navlink" href="timeline.html">故事时间线 <span class="n">↗</span></a>
    <a class="navlink" href="#x-文字时间线">文字时间线</a>
    <a class="navlink" href="#x-发生／披露对照">发生／披露对照</a>
    <a class="navlink" href="#x-伏笔">伏笔</a>
    <h3>人物与设定</h3>
    <input class="filter" placeholder="筛选名字…" aria-label="筛选人物与设定">
    ${S.domains.map(([d, label]) => bySec(d).length ? `<details ${d === 'CHARACTER' ? 'open' : ''}><summary>${label}<span class="n">${bySec(d).length}</span></summary>
      ${bySec(d).map((o) => `<a class="navlink" href="#o-${o.id}" data-name="${o.name}">${o.name}</a>`).join('')}</details>` : '').join('')}
    <h3>正文</h3>
    <div class="chapters">${Array.from({ length: 17 }, (_, i) => `<a href="#ch${i + 1}">${i + 1}</a>`).join('')}</div>`;
  side.querySelector('.filter').addEventListener('input', (e) => {
    const q = e.target.value.trim();
    side.querySelectorAll('details').forEach((d) => { let any = false; d.querySelectorAll('.navlink').forEach((a) => { const on = !q || a.dataset.name.includes(q); a.hidden = !on; any ||= on; }); d.hidden = !any; if (q) d.open = true; });
  });

  /* ---------- pages ---------- */
  const head = (crumb, title, meta = '', extra = '') => `<nav class="crumb" aria-label="位置">${crumb}</nav>
    <div class="doc-head"><h1>${title}</h1>
      <div class="aa"><button class="iconbtn" data-aa aria-label="阅读设置" title="阅读设置"><b style="font:600 16px var(--serif)">Aa</b></button>
      <div class="aa-pop" hidden>
        <div class="row">字号 <span class="seg" data-set="size"><button data-v="16px">小</button><button data-v="18px">中</button><button data-v="20px">大</button></span></div>
        <div class="row">字体 <span class="seg" data-set="font"><button data-v="serif">宋体</button><button data-v="ui">黑体</button></span></div>
      </div></div></div>
    ${meta ? `<div class="doc-meta">${meta}</div>` : ''}${extra}`;
  const crumb = (...parts) => parts.map((p, i) => (i ? '<span>›</span>' : '') + p).join('');

  const pages = {
    index() {
      const domainCards = S.domains.map(([d, label]) => bySec(d).length ? `<h2 id="h-${d}">${label}</h2><ul class="cards">${bySec(d).map((o) =>
        `<li><a href="#o-${o.id}" data-o="${o.id}"><b>${o.name}</b><span>${o.desc}</span></a></li>`).join('')}</ul>` : '').join('');
      return { title: '总目录', html: head(crumb('<a href="#index">Maritime Story</a>'), '故事知识库', '<span class="pill">已处理正文：第1–17章</span><span class="pill">13 个人物与设定</span><span class="pill">25 条事件节点</span>') +
        `<div class="prose"><h2 id="h-in">入口</h2><ul class="cards">
          <li><a href="timeline.html"><b>故事时间线</b><span>按故事先后看所有事件与人物线</span></a></li>
          <li><a href="#events"><b>事件索引</b><span>每个事件一页：时间、经过、参与、出处</span></a></li>
          <li><a href="#x-发生／披露对照"><b>发生／披露对照</b><span>事情发生的先后与书里写出的先后</span></a></li>
          <li><a href="#x-伏笔"><b>伏笔</b><span>埋下、提起、回收的位置</span></a></li></ul>${domainCards}</div>` };
    },
    events() {
      let h = '', band = -1; const seen = new Set();
      ordered.forEach(([pid, p]) => {
        const eid = pid.split('@')[0]; if (seen.has(eid)) return; seen.add(eid);
        if (p.b !== band) { band = p.b; h += `${band ? '</ul>' : ''}<h2 id="b${band}">${S.bands[band]}</h2><ul>`; }
        h += `<li>${ev(pid)} <a href="#e-${pid.split('@')[0]}">${p.title}</a> — ${p.story}</li>`;
      });
      return { title: '事件索引', html: head(crumb('<a href="#index">总目录</a>', '事件'), '事件索引', '<span class="pill">按故事发生先后</span><a class="pill accent" href="timeline.html">在时间线中看 →</a>') + `<div class="prose">${h}</ul></div>` };
    },
    owner(id, sub) {
      const o = O[id]; if (!o) return null;
      const pts = pointsOf(id), first = pts[0]?.p.locs[0];
      const related = [...new Set(pts.flatMap(({ pid }) => S.owners.filter((x) => x.id !== id && x.pts.some(([p]) => p === pid)).map((x) => x.id)))];
      const subs = [['', '起点'], ['now', '当前'], ['t', '时间索引'], ['n', '叙事索引'], ['side', '支线']];
      const tabs = `<nav class="subtabs">${subs.map(([k, l]) => `<a href="#o-${id}${k ? '/' + k : ''}" ${k === (sub || '') ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>`;
      const meta = `<span class="pill">${dom[o.domain]}</span><span class="pill">${pts.length} 个事件</span>${first ? `<span class="pill">首见 ${S.loc(first).label}</span>` : ''}<a class="pill accent" href="timeline.html#line-${id}">在时间线中看这条线 →</a>`;
      let body;
      if (sub === 't') {
        let band = -1; body = '';
        pts.forEach(({ pid, text, p }) => { if (p.b !== band) { body += `${band >= 0 ? '</ul>' : ''}<h2 id="b${p.b}">${S.bands[p.b]}</h2><ul>`; band = p.b; } body += `<li>${ev(pid)} ${esc(text)} ${p.locs.slice(0, 2).map(loc).join('')}</li>`; });
        body += '</ul>';
      } else if (sub) {
        return { title: o.name, html: head(crumb('<a href="#index">总目录</a>', dom[o.domain], o.name), o.name, meta, tabs) + `<div class="prose"><p style="color:var(--ink-3)">样稿只做了「起点」和「时间索引」两页。</p></div>` };
      } else {
        const keys = pts.filter((x) => x.key || id !== 'shen').slice(0, 5);
        body = `<p><b>基本</b>：${esc(o.desc)}。</p>
          <h2 id="h-k">知识页</h2><ul>
            <li><a href="#x-知识页">知识 · ${o.name}的来历与处境</a> 身份、住处与生计的稳定事实</li>
            ${id === 'shen' ? '<li><a href="#x-分析页">分析 · 灯塔失火后的沉默</a> 为什么十年不追问罗盘和潮汐表</li>' : ''}</ul>
          <h2 id="h-key">${id === 'shen' ? '关键事件' : '事件'}</h2><ul>${keys.map(({ pid, text, p }) => `<li>${ev(pid)} ${esc(text)} ${loc(p.locs[0])}</li>`).join('')}</ul>
          <p><a href="#o-${id}/t">全部 ${pts.length} 个事件，按故事先后 →</a></p>
          <h2 id="h-rel">相关</h2><p>${related.map(ent).join('　')}</p>`;
      }
      return { title: o.name, html: head(crumb('<a href="#index">总目录</a>', dom[o.domain], o.name), o.name, meta, tabs) + `<div class="prose">${body}</div>`,
        rail: `<div class="box"><h4>相关</h4>${related.slice(0, 6).map((r) => `<a href="#o-${r}" data-o="${r}">${O[r].name}</a>`).join('')}</div>` };
    },
    event(eid, at) {
      const named = ordered.filter(([pid]) => pid.split('@')[0] === eid);
      if (!named.length) return null;
      const [pid0, p] = named[0];
      const i = ordered.findIndex(([pid]) => pid === pid0);
      const prev = ordered.slice(0, i).reverse().find(([pid]) => pid.split('@')[0] !== eid);
      const next = ordered.slice(i).find(([pid]) => pid.split('@')[0] !== eid);
      const lines = (pid) => S.owners.filter((o) => o.pts.some(([x]) => x === pid));
      const roles = Object.entries(p.roles);
      const persp = (pid) => S.owners.map((o) => [o, o.pts.find(([x]) => x === pid)]).filter(([, x]) => x)
        .map(([o, x]) => `<li><span class="swatch" style="background:${color[o.id] || 'var(--axis)'}"></span>${ent(o.id)}：${esc(x[1])}</li>`).join('');
      const disclose = named.flatMap(([pid, q]) => q.locs.map((l) => `<tr><td>${loc(l)}</td><td>${esc(pid.includes('@') ? q.pt : q.t)}</td><td>${lines(pid).filter((o) => o.domain === 'CHARACTER').map((o) => ent(o.id)).join(' ')}</td></tr>`)).join('');
      let h = `<dl class="fact"><dt>时间</dt><dd>${esc(p.time)}</dd>${p.end ? `<dt>结束</dt><dd>${esc(p.end)}</dd>` : ''}
        <dt>先后</dt><dd>${prev ? `晚于 ${ev(prev[0])} ${esc(prev[1].title)}` : '最早'}${next ? `；早于 ${ev(next[0])} ${esc(next[1].title)}` : ''}</dd>
        <dt>经过</dt><dd>${esc(p.story)}</dd></dl>`;
      if (named.length > 1 || pid0.includes('@')) h += named.map(([pid, q]) => `<h2 id="at-${pid.split('@')[1]}">${pid.split('@')[1]}</h2><p>${esc(q.pt)} ${q.locs.map(loc).join('')}</p><ul>${persp(pid)}</ul>`).join('');
      if (roles.length) h += `<h2 id="h-roles">参与与时间线索</h2><ul>${roles.map(([id, t]) => `<li>${ent(id)}：${esc(t)}。 ${p.locs.slice(0, 2).map(loc).join('')}</li>`).join('')}</ul>`;
      if (!pid0.includes('@')) h += `<h2 id="h-lines">各线</h2><ul>${persp(pid0)}</ul>`;
      h += `<h2 id="h-dis">披露</h2><table><thead><tr><th>出处</th><th>写出了什么</th><th>涉及</th></tr></thead><tbody>${disclose}</tbody></table>`;
      const pager = `<nav class="pager">${prev ? `<a href="#e-${prev[0].split('@')[0]}"><small>← 上一件</small>${S.pid(prev[0].split('@')[0])} ${prev[1].title}</a>` : '<span></span>'}${next ? `<a href="#e-${next[0].split('@')[0]}" style="text-align:right"><small>下一件 →</small>${S.pid(next[0].split('@')[0])} ${next[1].title}</a>` : ''}</nav>`;
      return { title: `${S.pid(eid)} ${p.title}`, at: at ? `at-${at}` : '',
        html: head(crumb('<a href="#index">总目录</a>', '<a href="#events">事件</a>', S.pid(eid)), esc(p.title),
          `<span class="pill">${S.pid(eid)}</span><span class="pill">${S.bands[p.b]}</span><a class="pill accent" href="timeline.html#p-${pid0}">在时间线中定位 →</a>`) + `<div class="prose">${h}</div>${pager}` };
    },
    chapter(n, para) {
      const evs = ordered.filter(([, p]) => p.locs.some((l) => l.startsWith(n + '·')));
      const meta = `<span class="pill">${n === 4 ? '18 段 · 约 1,500 字' : '样稿未收录'}</span>${evs.slice(0, 6).map(([pid]) => `<a class="pill" href="#e-${pid.split('@')[0]}">${S.pid(pid)}</a>`).join('')}`;
      const body = n === 4 ? S.chapter4.map((t, i) => `<p id="p${i + 1}"><a class="pn" href="#ch4:p${i + 1}" title="本段链接">${i + 1}</a>${esc(t)}</p>`).join('')
        : `<p style="text-indent:0;color:var(--ink-3)">样稿只收录了<a href="#ch4">第4章</a>的占位正文。</p>`;
      const pager = `<nav class="pager">${n > 1 ? `<a href="#ch${n - 1}"><small>← 上一章</small>第${n - 1}章</a>` : '<span></span>'}${n < 17 ? `<a href="#ch${n + 1}" style="text-align:right"><small>下一章 →</small>第${n + 1}章</a>` : ''}</nav>`;
      return { title: `第${n}章`, at: para ? `p${para}` : '', chapter: n,
        html: head(crumb('正文', `第${n}章`), `第${n}章`, meta) + `<div class="prose source">${body}</div>${pager}`,
        rail: evs.length ? `<div class="box"><h4>本章写到的事件</h4>${evs.map(([pid, p]) => `<a href="#e-${pid.split('@')[0]}">${S.pid(pid)} ${p.title}<br><small style="color:var(--ink-3)">${p.locs.filter((l) => l.startsWith(n + '·')).map((l) => S.loc(l).label.split('·')[1]).join('、')}</small></a>`).join('')}</div>` : '' };
    },
  };

  const route = () => {
    const h = decodeURIComponent(location.hash.slice(1)) || 'index';
    let m;
    if (h === 'index' || h === 'events') return pages[h]();
    if ((m = /^o-([a-z]+)(?:\/(\w+))?$/.exec(h))) return pages.owner(m[1], m[2]);
    if ((m = /^e-(\d{3})(?:@(.+))?$/.exec(h))) return pages.event(m[1], m[2]);
    if ((m = /^ch(\d+)(?::p(\d+))?$/.exec(h))) return pages.chapter(Number(m[1]), m[2]);
    return { title: h.replace(/^x-/, ''), html: head(crumb('<a href="#index">总目录</a>'), esc(h.replace(/^x-/, ''))) + '<div class="prose"><p style="color:var(--ink-3)">样稿没有做这一页；正式版照常显示同步来的编译页。</p></div>' };
  };

  /* ---------- render ---------- */
  let current = null;
  const back = Object.assign(document.createElement('button'), { className: 'backchip', hidden: true });
  document.body.append(back);
  let goingBack = false;
  back.addEventListener('click', () => { goingBack = true; history.back(); });
  const render = () => {
    const page = route() || pages.index();
    const prevTitle = current?.title, sameDoc = current && current.title === page.title;
    doc.innerHTML = page.html;
    current = page;
    document.title = `样稿 · ${page.title} · 小离总周报`;
    // outline + extra rail box
    const hs = [...doc.querySelectorAll('.prose h2[id]')];
    rail.innerHTML = (hs.length ? `<h4>本页</h4>${hs.map((h) => `<a href="#${location.hash.slice(1).split(':')[0]}" data-to="${h.id}">${h.textContent}</a>`).join('')}` : '') + (page.rail || '');
    // side nav state
    const key = location.hash.slice(1).split(/[:/@]/)[0] || 'index';
    side.querySelectorAll('a[href^="#"]').forEach((a) => (a.getAttribute('href') === '#' + key ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    // reading settings
    applySettings();
    // scroll target
    if (page.at) {
      const t = document.getElementById(page.at);
      if (t) { t.scrollIntoView({ block: page.chapter ? 'center' : 'start' }); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
    } else if (!sameDoc) scrollTo(0, 0);
    // back chip after a jump to another page
    if (goingBack) { back.hidden = true; goingBack = false; } else if (prevTitle && !sameDoc) { back.hidden = false; back.textContent = `← 返回 ${prevTitle}`; }
  };
  rail.addEventListener('click', (e) => { const a = e.target.closest('[data-to]'); if (a) { e.preventDefault(); document.getElementById(a.dataset.to)?.scrollIntoView({ behavior: 'smooth' }); } });
  addEventListener('hashchange', render);

  /* ---------- 阅读设置 ---------- */
  const settings = { size: innerWidth <= 860 ? '17px' : '18px', font: 'serif' };
  function applySettings() {
    document.documentElement.style.setProperty('--read-size', settings.size === '17px' && innerWidth > 860 ? '18px' : settings.size);
    document.documentElement.style.setProperty('--read-font', settings.font === 'ui' ? 'var(--ui)' : 'var(--serif)');
    doc.querySelectorAll('[data-set] button').forEach((b) => b.setAttribute('aria-pressed', String(settings[b.parentElement.dataset.set] === b.dataset.v || (b.dataset.v === '18px' && settings.size === '17px'))));
  }
  doc.addEventListener('click', (e) => {
    const t = e.target.closest('[data-aa]'); if (t) { const pop = t.nextElementSibling; pop.hidden = !pop.hidden; return; }
    const b = e.target.closest('[data-set] button'); if (b) { settings[b.parentElement.dataset.set] = b.dataset.v; applySettings(); }
  });

  /* ---------- 人物链接预览（桌面悬停） ---------- */
  if (matchMedia('(hover: hover)').matches) {
    const peek = Object.assign(document.createElement('div'), { className: 'peek', hidden: true });
    document.body.append(peek);
    document.addEventListener('mouseover', (e) => {
      const a = e.target.closest('a[data-o]'); if (!a) { peek.hidden = true; return; }
      const o = O[a.dataset.o], r = a.getBoundingClientRect();
      peek.innerHTML = `<b>${o.name}</b><span class="k">${dom[o.domain]} · ${o.pts.length} 个事件</span><p>${o.desc}</p>`;
      peek.hidden = false;
      peek.style.left = Math.min(r.left, innerWidth - 306) + 'px';
      peek.style.top = (r.bottom + 8 + 150 > innerHeight ? r.top - peek.offsetHeight - 8 : r.bottom + 8) + 'px';
    });
  }
  render();
})();
</script>
</body>
</html>
